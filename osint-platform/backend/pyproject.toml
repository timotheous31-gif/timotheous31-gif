[project]
name = "osint-platform-backend"
version = "0.1.0"
description = "Privacy-first OSINT investigation platform - backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "dnspython>=2.7",
    "celery>=5.4",
    "redis>=5.2",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "jinja2>=3.1",
    "selectolax>=0.3.21",
    "python-dateutil>=2.9",
    "idna>=3.10",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "types-python-dateutil",
    "pre-commit>=4.0",
]

[project.scripts]
osint = "app.cli.main:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert is fine in tests and internal invariants
    "B008",   # FastAPI Depends() in defaults
    "RUF012", # mutable class attrs (collector metadata lists)
    "N818",   # error-class naming
    "SIM108", # ternary preference
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"alembic/*" = ["E501", "N999"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "alembic/*"]
